<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel · QuickGanyu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<nav class="navbar">
  <a class="logo" href="../index.html">Quick<span>Ganyu</span> <i class="fas fa-bolt" style="color:#f5c842; font-size:1.2rem;"></i></a>
  <div class="nav-links">
    <a href="../index.html"><i class="fas fa-home"></i> Home</a>
    <a href="providers.html"><i class="fas fa-search"></i> Browse</a>
  </div>
  <div class="nav-actions">
    <!-- filled by api.js -->
  </div>
</nav>

<div class="container" id="page-root">
  <!-- Content injected by JS after auth check -->
  <div class="empty-state" id="loading-state">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Loading dashboard…</p>
  </div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-top">
      <div class="footer-col">
        <h4>QuickGanyu</h4>
        <a href="../index.html">About</a>
        <a href="providers.html">Services</a>
      </div>
      <div class="footer-col">
        <h4>Explore</h4>
        <a href="../index.html">Home</a>
        <a href="providers.html">Browse</a>
      </div>
      <div class="footer-col">
        <h4>Contact</h4>
        <span>Malawi</span>
        <span>Email: info@quickganyu.com</span>
        <span>Phone: +265 999 000 000</span>
      </div>
      <div class="footer-col footer-newsletter">
        <h4>Newsletter</h4>
        <div class="newsletter-form">
          <input type="email" placeholder="Email address">
          <button type="button">Subscribe</button>
        </div>
        <div class="footer-social">
          <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
          <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
          <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <div class="footer-brand">Quick<span>Ganyu</span></div>
      <div class="footer-copy">&copy; 2026 QuickGanyu – built for Malawi</div>
      <a class="footer-backtop" href="#top"><i class="fas fa-arrow-up"></i></a>
    </div>
  </div>
</footer>

<script src="../js/api.js"></script>
<script>
(function () {
  const { apiFetch, toast, esc, showFormErrors } = window.QuickGanyu;
  const root = document.getElementById('page-root');

  // ── State ────────────────────────────────────────────────────────────────────
  let allRequests = [];
  let activeTab   = 'pending'; // 'pending' | 'approved' | 'declined' | 'add'

  // ── Boot: verify admin session ───────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    const me = await window.QuickGanyu.fetchMe();
    if (!me || me.role !== 'admin') {
      root.innerHTML = `
        <section class="section-card" style="max-width:520px;margin:3rem auto;text-align:center;padding:2.5rem;">
          <i class="fas fa-lock" style="font-size:2.5rem;color:#f5c842;display:block;margin-bottom:1rem;"></i>
          <h2>Admin access only</h2>
          <p style="color:#666;margin:1rem 0 1.5rem;">You need to be logged in as an admin to view this page.</p>
          <a href="login.html" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Go to Login</a>
        </section>`;
      return;
    }
    await loadDashboard();
  });

  // ── Load data & render ───────────────────────────────────────────────────────
  async function loadDashboard() {
    const res = await apiFetch('admin.php', { action: 'list' });
    if (!res.ok) {
      toast(res.error || 'Failed to load dashboard data.', 'error');
      return;
    }
    allRequests = res.requests || [];
    renderDashboard(res.counts, res.users);
  }

  function renderDashboard(counts, users) {
    root.innerHTML = `
      <section class="hero-card hero" style="margin-bottom:1.4rem;">
        <div class="animated-feedback">
          <i class="fas fa-user-shield" style="color:#f5c842;"></i> Admin dashboard
        </div>
        <h1>Control the platform</h1>
        <p>Manage service provider accounts, review applications, and monitor the marketplace.</p>
      </section>

      <section class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <strong>${users.client}</strong><span>Customers</span>
        </div>
        <div class="stat-card">
          <strong>${users.provider}</strong><span>Providers</span>
        </div>
        <div class="stat-card">
          <strong>${counts.pending}</strong><span>Pending requests</span>
        </div>
        <div class="stat-card">
          <strong>${counts.approved}</strong><span>Approved</span>
        </div>
        <div class="stat-card">
          <strong>${counts.declined}</strong><span>Declined</span>
        </div>
      </section>

      <div class="admin-tabs" id="admin-tabs">
        <button class="admin-tab ${activeTab === 'pending'  ? 'active' : ''}" data-tab="pending">
          <i class="fas fa-clock"></i> Pending
          <span class="badge" style="margin-left:0.3rem;">${counts.pending}</span>
        </button>
        <button class="admin-tab ${activeTab === 'approved' ? 'active' : ''}" data-tab="approved">
          <i class="fas fa-check-circle"></i> Approved
        </button>
        <button class="admin-tab ${activeTab === 'declined' ? 'active' : ''}" data-tab="declined">
          <i class="fas fa-times-circle"></i> Declined
        </button>
        <button class="admin-tab ${activeTab === 'add'      ? 'active' : ''}" data-tab="add">
          <i class="fas fa-user-plus"></i> Add Provider
        </button>
      </div>

      <div id="tab-content"></div>
    `;

    // Tab click handler
    document.getElementById('admin-tabs').addEventListener('click', e => {
      const btn = e.target.closest('.admin-tab');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.admin-tab').forEach(b => b.classList.toggle('active', b === btn));
      renderTabContent();
    });

    renderTabContent();
  }

  // ── Tab content renderer ─────────────────────────────────────────────────────
  function renderTabContent() {
    const el = document.getElementById('tab-content');
    if (!el) return;

    if (activeTab === 'add') {
      renderAddProviderForm(el);
      return;
    }

    const filtered = allRequests.filter(r => r.status === activeTab);
    if (filtered.length === 0) {
      el.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-inbox"></i>
          <p>No ${activeTab} requests.</p>
        </div>`;
      return;
    }

    el.innerHTML = `<div class="requests-list" id="requests-list"></div>`;
    const list = document.getElementById('requests-list');
    filtered.forEach(req => list.appendChild(buildRequestCard(req)));
  }

  // ── Request card ─────────────────────────────────────────────────────────────
  function buildRequestCard(req) {
    const card = document.createElement('div');
    card.className = 'request-card';
    card.id = `req-${req.id}`;

    const statusHtml = `<span class="status-pill status-pill--${req.status}">${req.status}</span>`;
    const date = req.created_at
      ? new Date(req.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })
      : '';

    const actionsHtml = req.status === 'pending' ? `
      <button class="btn-approve" data-action="approve" data-id="${req.id}">
        <i class="fas fa-check"></i> Approve
      </button>
      <button class="btn-decline" data-action="decline" data-id="${req.id}">
        <i class="fas fa-times"></i> Reject
      </button>` : '';

    card.innerHTML = `
      <div class="rc-header">
        <div>
          <strong style="font-size:1.05rem;">${esc(req.full_name)}</strong>
          ${statusHtml}
        </div>
        <span style="color:#888;font-size:0.82rem;">${date}</span>
      </div>
      <p class="rc-meta"><i class="fas fa-briefcase" style="width:16px;color:#f5c842;"></i> ${esc(req.service_category)}</p>
      <p class="rc-meta"><i class="fas fa-envelope"  style="width:16px;color:#f5c842;"></i> ${esc(req.email)}</p>
      <div class="rc-actions" id="actions-${req.id}">${actionsHtml}</div>
      <div id="result-${req.id}"></div>
    `;

    card.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => handleDecision(btn.dataset.action, parseInt(btn.dataset.id)));
    });

    return card;
  }

  // ── Approve / Decline handler ────────────────────────────────────────────────
  async function handleDecision(action, id) {
    const actionsEl = document.getElementById(`actions-${id}`);
    const resultEl  = document.getElementById(`result-${id}`);

    // Disable buttons while in flight
    actionsEl && actionsEl.querySelectorAll('button').forEach(b => b.disabled = true);

    const res = await apiFetch('admin.php', { action, id });

    if (!res.ok) {
      toast(res.error || 'Action failed. Please try again.', 'error');
      actionsEl && actionsEl.querySelectorAll('button').forEach(b => b.disabled = false);
      return;
    }

    // Update local state
    const idx = allRequests.findIndex(r => r.id === id);
    if (idx !== -1) allRequests[idx].status = action === 'approve' ? 'approved' : 'declined';

    toast(res.message, 'success');

    // Show result in-card
    let extra = '';
    if (action === 'approve' && res.temp_password) {
      extra = `
        <div class="temp-password-box">
          <i class="fas fa-key"></i>
          Temporary password for <strong>${esc(allRequests[idx]?.full_name || '')}</strong>:
          <strong style="font-size:1rem;letter-spacing:0.05em;">${esc(res.temp_password)}</strong>
          <span style="color:#888;"> — relay this if the email does not arrive.</span>
        </div>`;
    }

    if (actionsEl) actionsEl.innerHTML = '';
    if (resultEl) {
      resultEl.innerHTML = `
        <div class="temp-password-box" style="${action === 'decline' ? 'background:#fff0f2;border-color:#f5c2ca;color:#b00020;' : ''}">
          <i class="fas fa-${action === 'approve' ? 'check-circle' : 'times-circle'}"></i>
          ${esc(res.message)}
        </div>
        ${extra}`;
    }

    // Refresh stats after a short delay
    setTimeout(refreshStats, 1200);
  }

  // ── Refresh stat cards without full re-render ────────────────────────────────
  async function refreshStats() {
    const res = await apiFetch('admin.php', { action: 'list' });
    if (!res.ok) return;
    allRequests = res.requests || [];
    const sg = document.getElementById('stats-grid');
    if (sg) {
      sg.innerHTML = `
        <div class="stat-card"><strong>${res.users.client}</strong><span>Customers</span></div>
        <div class="stat-card"><strong>${res.users.provider}</strong><span>Providers</span></div>
        <div class="stat-card"><strong>${res.counts.pending}</strong><span>Pending requests</span></div>
        <div class="stat-card"><strong>${res.counts.approved}</strong><span>Approved</span></div>
        <div class="stat-card"><strong>${res.counts.declined}</strong><span>Declined</span></div>`;
    }
    // Update pending badge on tab
    const pendingTab = document.querySelector('[data-tab="pending"] .badge');
    if (pendingTab) pendingTab.textContent = res.counts.pending;
  }

  // ── Add Provider form ────────────────────────────────────────────────────────
  function renderAddProviderForm(el) {
    el.innerHTML = `
      <section class="section-card" style="max-width:860px;margin:0 auto;">
        <h3 style="margin-bottom:0.3rem;"><i class="fas fa-user-plus" style="color:#f5c842;"></i> Add a Service Provider</h3>
        <p class="muted" style="margin-bottom:1.2rem;">
          Create a provider account directly. A temporary password will be generated and shown here
          (and emailed to the provider). They will set their own username and password on first login.
        </p>

        <div id="add-error" class="form-banner form-banner--error" style="display:none;margin-bottom:1rem;"></div>
        <div id="add-success" style="display:none;"></div>

        <form id="add-provider-form" novalidate>
          <div class="add-provider-form">
            <div class="form-card">
              <label>Full name *
                <input type="text" name="full_name" placeholder="Provider's full name" required>
              </label>
            </div>
            <div class="form-card">
              <label>Email address *
                <input type="email" name="email" placeholder="provider@example.com" required>
              </label>
            </div>
            <div class="form-card">
              <label>Phone <span class="muted">(optional)</span>
                <input type="tel" name="phone" placeholder="+265 9xx xxx xxx">
              </label>
            </div>
            <div class="form-card">
              <label>Location <span class="muted">(optional)</span>
                <input type="text" name="location" placeholder="City or district">
              </label>
            </div>
            <div class="form-card">
              <label>Service category *
                <select name="service_category" required>
                  <option value="">— Select category —</option>
                  <option>Plumbing</option>
                  <option>Electrical</option>
                  <option>Carpentry</option>
                  <option>Painting</option>
                  <option>Cleaning</option>
                  <option>Photography</option>
                  <option>Catering</option>
                  <option>Tutoring</option>
                  <option>IT / Tech support</option>
                  <option>Tailoring</option>
                  <option>Gardening</option>
                  <option>Other</option>
                </select>
              </label>
            </div>
            <div class="form-card">
              <label>Years of experience <span class="muted">(optional)</span>
                <input type="number" name="experience_years" placeholder="e.g. 5" min="0" max="80">
              </label>
            </div>
            <div class="form-card full-col">
              <label>Skills <span class="muted">(optional)</span>
                <input type="text" name="skills" placeholder="e.g. Tiling, piping, burst pipes">
              </label>
            </div>
            <div class="form-card full-col">
              <label>About <span class="muted">(optional)</span>
                <textarea name="about" placeholder="Brief description of the provider…"></textarea>
              </label>
            </div>
          </div>

          <div class="auth-actions" style="margin-top:1.4rem;">
            <button type="submit" class="btn-primary" id="add-btn">
              <i class="fas fa-user-plus"></i> Create provider account
            </button>
          </div>
        </form>
      </section>
    `;

    const form    = document.getElementById('add-provider-form');
    const btn     = document.getElementById('add-btn');
    const errEl   = document.getElementById('add-error');
    const succEl  = document.getElementById('add-success');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';

      const data = {
        action:           'add_provider',
        full_name:        form.full_name.value.trim(),
        email:            form.email.value.trim(),
        phone:            form.phone.value.trim(),
        location:         form.location.value.trim(),
        service_category: form.service_category.value,
        experience_years: parseInt(form.experience_years.value) || 0,
        skills:           form.skills.value.trim(),
        about:            form.about.value.trim(),
      };

      const res = await apiFetch('admin.php', data);

      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-user-plus"></i> Create provider account';

      if (!res.ok) {
        if (res.errors) showFormErrors(res.errors);
        const first = res.errors ? Object.values(res.errors)[0] : (res.error || 'Failed to create provider.');
        errEl.textContent = first;
        errEl.style.display = 'block';
        return;
      }

      toast(res.message, 'success');
      form.reset();

      succEl.style.display = 'block';
      succEl.innerHTML = `
        <div class="temp-password-box" style="margin-bottom:1rem;">
          <i class="fas fa-check-circle" style="color:#1a7f4b;"></i>
          Provider account created for <strong>${esc(data.full_name)}</strong> (${esc(data.email)}).
          <br><br>
          Temporary password:
          <strong style="font-size:1.05rem;letter-spacing:0.06em;">${esc(res.temp_password)}</strong>
          <br>
          <span style="color:#888;font-size:0.85rem;">
            This was emailed to the provider. Share it manually if the email does not arrive.
            They will set a new password during first-login setup.
          </span>
        </div>`;

      // Refresh stats
      refreshStats();
    });
  }

})();
</script>
</body>
</html>
